<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>美化编辑器</title>
<link rel="stylesheet" href="https://fontsapi.zeoseven.com/136/hans-medium/result.css">
<link rel="stylesheet" href="https://fontsapi.zeoseven.com/144/main/result.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%}

:root{
  --page-bg:#fffffe;--card-bg:#fffffe;
  --text-color:#000;--text-body:#1c1c1e;--text-secondary:#536471;
  --follow-bg:#000;--follow-text:#fff;
  --editor-bg:#f5f5f5;--editor-border:#e0e0e0;
  --editor-accent:#1d9bf0;--editor-card:#fff;
}
body{
  background:var(--editor-bg);color:var(--text-color);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  transition:background-color .3s,color .3s;
}
body.dark #tweetPage{
  --page-bg:#000;--card-bg:#000;
  --text-color:#D7D7D7;--text-body:#D7D7D7;--text-secondary:#73787D;
  --follow-bg:#fff;--follow-text:#000;
  --editor-bg:#0a0a0a;--editor-border:#2a2a2a;--editor-card:#161616;
}

.editor-panel{
  width:100%;min-height:100vh;padding:20px 16px 100px;
  display:flex;flex-direction:column;gap:14px;background:var(--editor-bg);
}
body.preview-mode .editor-panel{display:none}

.editor-header{display:flex;align-items:center;justify-content:space-between;padding:4px 0}
.editor-header h2{font-size:20px;font-weight:700;color:var(--text-color)}

.editor-section{
  background:var(--editor-card);border:1px solid var(--editor-border);
  border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;
}
.editor-section-title{
  font-size:12px;font-weight:700;color:var(--text-secondary);
  text-transform:uppercase;letter-spacing:.5px;
}
.editor-row{display:flex;flex-direction:column;gap:4px}
.editor-row label{font-size:13px;font-weight:600;color:var(--text-color)}
.editor-row input[type="text"],
.editor-row input[type="number"],
.editor-row input[type="url"],
.editor-row select{
  width:100%;padding:10px 12px;border:1px solid var(--editor-border);
  border-radius:10px;background:var(--editor-bg);color:var(--text-color);
  font-size:15px;font-family:inherit;outline:none;transition:border-color .2s;
}
.editor-row input:focus,.editor-row select:focus{border-color:var(--editor-accent)}
.editor-row input[readonly]{opacity:.5}

.editor-inline{display:flex;gap:10px;align-items:flex-end}
.editor-inline .editor-row{flex:1}

.editor-toggle{display:flex;align-items:center;justify-content:space-between;gap:8px}
.editor-toggle label{font-size:13px;font-weight:600;color:var(--text-color)}
.toggle-switch{position:relative;width:44px;height:26px;flex-shrink:0}
.toggle-switch input{opacity:0;width:0;height:0}
.toggle-slider{
  position:absolute;inset:0;background:#ccc;border-radius:26px;cursor:pointer;transition:background .3s;
}
.toggle-slider::before{
  content:"";position:absolute;width:20px;height:20px;left:3px;bottom:3px;
  background:#fff;border-radius:50%;transition:transform .3s;
}
.toggle-switch input:checked+.toggle-slider{background:var(--editor-accent)}
.toggle-switch input:checked+.toggle-slider::before{transform:translateX(18px)}

.template-bar{display:flex;gap:8px;overflow-x:auto;padding:2px 0;-webkit-overflow-scrolling:touch}
.template-bar::-webkit-scrollbar{display:none}
.template-tab{
  padding:10px 20px;border:1.5px solid var(--editor-border);border-radius:12px;
  background:var(--editor-card);color:var(--text-color);
  font-size:14px;font-weight:600;font-family:inherit;white-space:nowrap;
  cursor:pointer;transition:all .2s;flex-shrink:0;
}
.template-tab.active{background:var(--text-color);color:var(--page-bg);border-color:var(--text-color)}
.template-tab:disabled{opacity:.35;cursor:not-allowed}

.char-bar{display:flex;gap:8px;align-items:center}
.char-bar select{
  flex:1;padding:10px 12px;border:1px solid var(--editor-border);border-radius:10px;
  background:var(--editor-bg);color:var(--text-color);font-size:14px;font-family:inherit;outline:none;
}
.char-btn{
  padding:10px 14px;border:1px solid var(--editor-border);border-radius:10px;
  background:var(--editor-card);color:var(--text-color);
  font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;white-space:nowrap;
  transition:all .15s;
}
.char-btn:active{transform:scale(.95)}
.char-btn-danger{color:#ef4444}
body.dark .char-btn-danger{color:#f87171}

.avatar-input-row{display:flex;gap:8px;align-items:center}
.avatar-input-row input[type="url"]{flex:1;min-width:0}
.avatar-upload-label{
  padding:10px 14px;border:1px solid var(--editor-border);border-radius:10px;
  background:var(--editor-card);color:var(--editor-accent);
  font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;
  transition:all .15s;display:flex;align-items:center;gap:4px;
}
.avatar-upload-label:active{transform:scale(.95)}
.avatar-thumb{
  width:38px;height:38px;border-radius:50%;overflow:hidden;flex-shrink:0;
  border:2px solid var(--editor-border);background:var(--editor-bg);
  display:none;align-items:center;justify-content:center;
}
.avatar-thumb.has-img{display:flex}
.avatar-thumb img{width:100%;height:100%;object-fit:cover;display:block}

.rich-toolbar{
  display:flex;align-items:center;gap:2px;padding:4px;
  background:var(--editor-bg);border-radius:10px;flex-wrap:wrap;
}
.tool-btn{
  width:36px;height:34px;border:none;border-radius:8px;background:transparent;
  color:var(--text-color);font-size:15px;font-family:inherit;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0;
}
.tool-btn:active{background:var(--editor-border)}
.tool-sep{width:1px;height:20px;background:var(--editor-border);margin:0 2px;flex-shrink:0}

.hl-bar{
  display:flex;align-items:center;gap:6px;padding:6px 8px;
  background:var(--editor-bg);border-radius:10px;flex-wrap:wrap;
}
.hl-label{font-size:12px;font-weight:600;color:var(--text-secondary);white-space:nowrap;margin-right:2px}
.hl-dot{
  width:26px;height:26px;border:2.5px solid transparent;border-radius:50%;
  cursor:pointer;transition:transform .15s,border-color .15s;flex-shrink:0;
}
.hl-dot:active{transform:scale(.88)}
.hl-dot-clear{
  background:var(--editor-card)!important;border:1.5px solid var(--editor-border)!important;
  font-size:11px;color:var(--text-secondary);display:flex;align-items:center;justify-content:center;
}

.rich-editor{
  position:relative;min-height:140px;max-height:400px;padding:12px;
  border:1px solid var(--editor-border);border-radius:10px;
  background:var(--editor-bg);color:var(--text-color);
  font-size:15px;font-family:inherit;line-height:1.6;outline:none;
  overflow-y:auto;word-wrap:break-word;overflow-wrap:anywhere;transition:border-color .2s;
}
.rich-editor:focus{border-color:var(--editor-accent)}
.rich-editor.is-empty::before{
  content:attr(data-placeholder);color:var(--text-secondary);pointer-events:none;
}
.rich-editor mark{border-radius:2px;padding:1px 0;color:inherit}
.rich-editor b,.rich-editor strong{font-weight:700}
.rich-editor i,.rich-editor em{font-style:italic}
.rich-editor u{text-decoration:underline}
.rich-editor s,.rich-editor strike{text-decoration:line-through}
.rich-editor span[style*="background-color"]{border-radius:2px;padding:1px 0}

.action-btn{
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:700;
  font-family:inherit;cursor:pointer;transition:opacity .2s,transform .1s;
}
.action-btn:active{transform:scale(.97)}
.btn-theme{
  background:var(--text-color);color:var(--page-bg);
  padding:10px 16px;font-size:14px;width:auto;border-radius:10px;
}

.floating-preview-btn{
  position:fixed;z-index:9999;bottom:24px;left:50%;transform:translateX(-50%);
  padding:14px 32px;border:none;border-radius:50px;
  background:var(--editor-accent);color:#fff;font-size:16px;font-weight:700;
  font-family:inherit;cursor:pointer;
  box-shadow:0 4px 20px rgba(29,155,240,.4);
  transition:opacity .2s,transform .1s;
}
.floating-preview-btn:active{transform:translateX(-50%) scale(.95)}
body.preview-mode .floating-preview-btn{display:none}

.toast{
  position:fixed;z-index:99999;bottom:80px;left:50%;
  transform:translateX(-50%) translateY(20px);
  padding:10px 24px;border-radius:50px;background:rgba(0,0,0,.8);color:#fff;
  font-size:14px;font-weight:600;font-family:inherit;
  pointer-events:none;opacity:0;transition:opacity .3s,transform .3s;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

#tweetPage{display:none}
body.preview-mode #tweetPage{
  display:flex;flex-direction:column;background:var(--page-bg);overflow:hidden;z-index:10000;
}

.preview-actions{display:none}
body.preview-mode .preview-actions{
  display:flex;position:fixed;z-index:10001;bottom:90px;left:50%;transform:translateX(-50%);
  gap:10px;opacity:1;transition:opacity .3s;
}
body.preview-mode .preview-actions.fade-out{opacity:0;pointer-events:none}
.preview-action-btn{
  padding:10px 22px;border:none;border-radius:50px;
  background:rgba(0,0,0,.65);color:#fff;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;
  white-space:nowrap;transition:transform .1s;
}
.preview-action-btn:active{transform:scale(.95)}
.preview-action-btn.btn-save{background:rgba(29,155,240,.85)}

.save-modal{
  display:none;position:fixed;z-index:99999;inset:0;
  align-items:center;justify-content:center;flex-direction:column;
}
.save-modal.show{display:flex}
.save-modal-overlay{position:absolute;inset:0;background:rgba(0,0,0,.75)}
.save-modal-body{
  position:relative;z-index:1;max-width:90vw;max-height:88vh;
  display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px;
}
.save-modal-hint{color:#fff;font-size:14px;font-weight:600;text-align:center}
.save-modal-img{
  max-width:100%;max-height:68vh;border-radius:10px;
  box-shadow:0 4px 30px rgba(0,0,0,.5);display:block;
}
.save-modal-btns{display:flex;gap:10px}
.save-modal-btn{
  padding:10px 28px;border:none;border-radius:50px;
  font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;
}
.save-modal-btn-download{background:var(--editor-accent);color:#fff}
.save-modal-btn-close{background:rgba(255,255,255,.2);color:#fff;backdrop-filter:blur(10px)}

.top-nav-wrapper{z-index:10;width:100%;flex-shrink:0;padding:0 30px 0;;background:var(--page-bg)}
.top-nav-bar{position:relative;width:100%;height:50px;overflow:hidden}
.top-nav-img{width:108%;max-width:none;height:auto;display:block;margin-left:-4%;pointer-events:none}
.top-nav-title{
  position:absolute;z-index:5;top:60%;left:50%;transform:translate(-50%,-50%);
  color:var(--text-color);font-size:16.5px;font-weight:550;line-height:1;
  letter-spacing:.5px;white-space:nowrap;pointer-events:none;
}
.top-nav-grok{
  position:absolute;z-index:5;top:62%;right:10%;transform:translateY(-50%);
  width:22px;height:22px;display:flex;align-items:center;justify-content:center;pointer-events:none;
}
.top-nav-grok svg{width:100%;height:100%;display:block;fill:var(--text-color)}

.scroll-content{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  padding:10px 30px 30px;-webkit-overflow-scrolling:touch;
}
.tweet-card{position:relative;z-index:1;width:100%;margin:14px 0;color:var(--text-color);background:var(--card-bg);overflow:visible}
.tweet-header{position:relative;z-index:2;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.tweet-avatar{
  position:relative;z-index:2;width:45px;height:45px;flex-shrink:0;
  overflow:hidden;border-radius:50%;background:#e5e5ea;
}
.tweet-avatar img{width:100%;height:100%;display:block;object-fit:cover;pointer-events:none}
.tweet-user-info{min-width:0;flex:1;display:flex;flex-direction:column;gap:1px}
.tweet-display-name{
  display:flex;align-items:center;gap:3px;min-width:0;
  color:var(--text-color);font-size:15px;font-weight:550;line-height:1.3;overflow-wrap:anywhere;
}
.tweet-verified{width:14px;height:14px;flex-shrink:0;display:inline-flex}
.tweet-verified svg{width:100%;height:100%;display:block}
.tweet-handle{color:var(--text-secondary);font-size:13.5px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.tweet-header-action{flex-shrink:0;margin-top:-15px;margin-right:-5px}
.tweet-header-action-img{width:62px;height:auto;display:block;pointer-events:none}

.tweet-translate-hint{
  display:none;align-items:center;gap:4px;margin-top:1px;margin-bottom:3px;
  color:var(--text-secondary);font-size:12px;font-weight:590;line-height:1.3;white-space:nowrap;
}
.tweet-translate-hint.visible{display:flex}
.tweet-translate-hint-icon{
  width:13px;height:13px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;
}
.tweet-translate-hint-icon svg{width:100%;height:100%;display:block;fill:var(--text-secondary)}

.tweet-body{
  position:relative;z-index:2;width:100%;margin-bottom:5px;
  color:var(--text-body);font-size:16px;font-weight:580;line-height:1.55;
  white-space:pre-wrap;overflow-wrap:anywhere;
}
.tweet-body mark{background:var(--hl-color,#fef08a);color:inherit;border-radius:2px;padding:1px 0;-webkit-text-fill-color:currentColor}
.tweet-body strong,.tweet-body b{font-weight:bolder}
.tweet-body em,.tweet-body i{font-style:italic}
.tweet-body u{text-decoration:underline}
.tweet-body s,.tweet-body strike,.tweet-body del{text-decoration:line-through}
.tweet-body span[style*="background-color"]{border-radius:2px;padding:1px 0}
body.dark .tweet-body span[style*="background-color"]{color:#1c1c1e}
.tweet-body.indented{text-indent:2em}
.tweet-body.indented div,.tweet-body.indented p{text-indent:2em}

.tweet-rate-translation{
  display:none;align-items:center;gap:1px;margin-top:0;margin-bottom:15px;
  color:var(--text-secondary);font-size:12px;font-weight:590;line-height:1.3;white-space:nowrap;
}
.tweet-rate-translation.visible{display:flex}
.tweet-rate-icon{width:55px;height:auto;display:inline-block;vertical-align:middle;pointer-events:none}

.tweet-meta{
  position:relative;z-index:2;width:100%;color:var(--text-secondary);
  font-size:13px;font-weight:590;line-height:1.4;overflow-wrap:anywhere;
}
body.dark .tweet-meta{color:var(--text-secondary)}
.tweet-meta-views{color:var(--text-color);font-weight:590}

.tweet-actions-bar{position:relative;z-index:999;width:100%;background:transparent;overflow:visible}
.tweet-actions-img{
  position:relative;z-index:1000;width:102%;max-width:none;height:auto;
  display:block;margin-top:-18px;margin-left:-1%;pointer-events:none;
}
.tweet-actions-numbers{position:absolute;z-index:1001;inset:0;pointer-events:none}
.action-count{
  position:absolute;color:var(--text-secondary);font-size:13px;font-weight:600;
  line-height:1;white-space:nowrap;pointer-events:none;
}
.action-count-reply{top:56%;left:8%}
.action-count-retweet{top:56%;left:31.5%}
.action-count-like{top:56%;left:54.5%}
.action-count-bookmark{top:56%;left:78%}

.bottom-tab-bar{z-index:10;width:100%;flex-shrink:0;padding:0 30px 2px;background:var(--page-bg)}
.bottom-tab-img{width:108%;max-width:none;height:auto;display:block;margin-left:-4%;pointer-events:none}

body.dark .top-nav-img,
body.dark .tweet-header-action-img,
body.dark .tweet-rate-icon {
  filter: invert(1);
}
@media(max-width:430px){
.top-nav-wrapper{padding:0 20px 0}
  .scroll-content{padding:10px 20px 24px}
  .bottom-tab-bar{padding:0 20px 2px}
}

/* 工具箱编辑界面，不改变推文成品排版 */
.editor-panel {
  --editor-bg: #fdfdfb;
  --editor-card: #ffffff;
  --editor-border: #e8e8e2;
  --editor-accent: #555650;
  --text-color: #292927;
  --text-secondary: #8f9089;

  max-width: 760px;
  margin: 0 auto;
  padding: 24px 17px 100px;
  gap: 0;
  background: var(--editor-bg);
  font-family: "Courier Prime", "Courier New", monospace;
}

body {
  background: #fdfdfb;
}

.editor-header {
  padding: 0 0 24px;
  gap: 16px;
}

.editor-header h2 {
  font-size: 22px;
  font-weight: 400;
}

.editor-section {
  padding: 22px 0;
  gap: 14px;
  border: 0;
  border-top: 1px solid var(--editor-border);
  border-radius: 0;
  background: transparent;
}

.editor-section-title {
  color: #555650;
  font-size: 13px;
  font-weight: 400;
  letter-spacing: 0;
}

.editor-row,
.editor-inline,
.char-bar {
  min-width: 0;
}

.editor-inline .editor-row,
.char-bar select {
  min-width: 0;
}

.editor-row label,
.editor-toggle > label:first-child {
  color: #66675f;
  font-size: 12px;
  font-weight: 400;
}

.editor-row input[type="text"],
.editor-row input[type="number"],
.editor-row input[type="url"],
.editor-row select,
.char-bar select {
  min-height: 42px;
  border-radius: 0;
  background: #fff;
  color: #383834;
  font-size: 16px;
}

.char-btn,
.avatar-upload-label,
.btn-theme {
  min-height: 42px;
  padding: 10px 12px;
  border: 1px solid #deded7;
  border-radius: 0;
  background: #fff;
  color: #66675f;
  font-size: 12px;
  font-weight: 400;
}

.char-btn-danger {
  color: #9a6262;
}

body.dark .char-btn-danger {
  color: #9a6262;
}

.avatar-upload-label {
  justify-content: center;
}

.rich-toolbar,
.hl-bar {
  border-radius: 0;
  background: #f3f3ef;
}

.tool-btn {
  border-radius: 3px;
}

.rich-editor {
  border-radius: 0;
  background: #fff;
  color: #383834;
  font-size: 16px;
}

.floating-preview-btn {
  left: auto;
  right: 18px;
  bottom: 18px;
  transform: none;
  padding: 12px 18px;
  border: 1px solid #555650;
  border-radius: 0;
  background: #555650;
  box-shadow: 0 5px 18px rgba(0, 0, 0, 0.12);
  font-size: 12px;
  font-weight: 400;
}

.floating-preview-btn:active {
  transform: scale(0.97);
}

.preview-action-btn,
.save-modal-btn {
  border-radius: 4px;
  font-weight: 400;
}

.preview-action-btn.btn-save,
.save-modal-btn-download {
  background: #555650;
}

.editor-panel button,
.editor-panel input,
.editor-panel select {
  font-family: inherit;
}

.editor-panel button:focus-visible,
.editor-panel select:focus-visible {
  outline: 2px solid #777870;
  outline-offset: 3px;
}


.tweet-body {
  font-family: -apple-system, BlinkMacSystemFont,
    "SF Pro Text", "PingFang SC", "Helvetica Neue",
    Helvetica, Arial, sans-serif;
}
/* 全局文字跟随字体选择 */
body,
body * {
  font-family: var(
    --selected-font,
    -apple-system, BlinkMacSystemFont,
    "SF Pro Text", "PingFang SC",
    "Helvetica Neue", Helvetica, Arial, sans-serif
  ) !important;
}
/* ==================== 订阅按钮：调整区 ==================== */

.tweet-header-action {
  position: relative;

  /* 整个按钮的位置：数值越负，越往上 */
  margin-top: -15px;

  /* 整个按钮的位置：数值越负，越往右 */
  margin-right: -5px;
}

.tweet-header-action-img {
  /* 按钮图片宽度，文字也会跟随图片位置 */
  width: 62px;
  height: auto;
  display: block;
}

.subscribe-label {
  position: absolute;
  z-index: 1;

  /* 文字横向位置：50% 居中；增大往右，减小往左 */
  left: 50%;

  /* 文字纵向位置：50% 居中；增大往下，减小往上 */
  top: 50%;

  /* 以文字中心对齐上面的位置，通常不用改 */
  transform: translate(-50%, -50%);

  /* 字号：数值越大，字越大 */
  font-size: 12px;

  /* 粗细：400 常规，500 中等，600 较粗，700 粗体 */
  font-weight: 600;

  /* 字间距：想让“订 阅”更疏一些，可以改成 1px */
  letter-spacing: 0;

  line-height: 1;
  white-space: nowrap;
  pointer-events: none;

  /* 浅色模式文字颜色 */
  color: #ffffff;
}

/* 深色模式文字颜色 */
body.dark .subscribe-label {
  color: #000000;
}


/* ==================== 底部回复文字：调整区 ==================== */

.bottom-reply-wrap {
  position: relative;
  width: 100%;
}

.bottom-reply-label {
  /* 横向偏移：负数往左，正数往右 */
  --reply-x: -6px;

  /* 纵向偏移：负数往上，正数往下 */
  --reply-y: -40px;

  position: absolute;
  z-index: 1;

  /* 基准位置，之后通常不用改 */
  left: 12px;
  right: 45px;
  top: 50%;

  /* 先垂直居中，再按上面的像素数移动 */
  transform: translate(
    var(--reply-x),
    calc(-50% + var(--reply-y))
  );

  /* 字号 */
  font-size: 15px;

  font-weight: 550;

  /* 字间距 */
  letter-spacing: 0;

  line-height: 1.4;
  text-align: left;

  /* 保持单行，太长时显示省略号 */
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;

  pointer-events: none;

  /* 浅色模式文字颜色 */
  color: #57616D;
}

/* 深色模式文字颜色 */
body.dark .bottom-reply-label {
  color: #929292;
}
#pageHeightRow[hidden] {
  display: none;
}

body.preview-mode {
  position: relative;
}

body.preview-mode.auto-tweet #tweetPage > .scroll-content {
  flex: none;
  height: auto;
  min-height: 0;
  max-height: none;
  overflow: visible;
}

/* 去掉板头下方的第一条横线 */
.editor-panel > .editor-header + .editor-section {
  border-top: 0;
  padding-top: 0;
}
</style>

var STORE_KEY='beautyEditor';

function saveStore(d){localStorage.setItem(STORE_KEY,JSON.stringify(d))}
function genId(){return 'c_'+Date.now()+'_'+Math.random().toString(36).substr(2,5)}

var editFontFamily=$('editFontFamily');
var editBold=$('editBold');
/* 加粗增量：可改为 50、100、150，数值越大越粗 */
var GLOBAL_WEIGHT_ADD=100;
var originalWeights=new Map();

function resetGlobalWeight(){
  originalWeights.forEach(function(old,el){
    if(old.value){
      el.style.setProperty('font-weight',old.value,old.priority);
    }else{
      el.style.removeProperty('font-weight');
    }
  });
  originalWeights.clear();
}

function applyGlobalWeight(){
  if(!editBold.checked)return;

  /* 先读取全部原始字重，避免父元素加粗后影响子元素的计算 */
  var items=Array.from(document.querySelectorAll('body, body *'))
    .filter(function(el){
      return !el.matches('script, style, link, meta');
    })
    .map(function(el){
      var weight=parseFloat(getComputedStyle(el).fontWeight);
      return {el:el,weight:Number.isFinite(weight)?weight:400};
    });

  items.forEach(function(item){
    var el=item.el;
    originalWeights.set(el,{
      value:el.style.getPropertyValue('font-weight'),
      priority:el.style.getPropertyPriority('font-weight')
    });
    el.style.setProperty(
      'font-weight',
      String(Math.min(1000,item.weight+GLOBAL_WEIGHT_ADD)),
      'important'
    );
  });
}

var editReplyText=$('editReplyText');
var previewReplyText=$('previewReplyText');

function populateFontSelect(){
  var families=new Set();

  document.fonts.forEach(function(font){
    var family=font.family.replace(/^["']|["']$/g,'');
    if(family!=='TweetQuote')families.add(family);
  });

  families.forEach(function(family){
    var option=document.createElement('option');
    option.value=family;
    option.textContent=family;
    editFontFamily.appendChild(option);
  });
}

/* ==================== 图片预缓存 ==================== */
var imgCache={};

function collectUrls(){
  var urls=[];
  tweetPage.querySelectorAll('img').forEach(function(img){
    ['src','data-light-src','data-dark-src'].forEach(function(attr){
      var u=img.getAttribute(attr);
      if(u&&u!=='about:blank'&&!u.startsWith('data:')&&!u.startsWith('blob:'))
        if(urls.indexOf(u)<0) urls.push(u);
    });
  });
  return urls;
}

function cacheImg(url,pi,cb){
  if(imgCache[url]) return cb(true);
  if(pi>=3) return cb(false);
  var proxied;
  if(pi===0) proxied='https://wsrv.nl/?url='+encodeURIComponent(url);
  else if(pi===1) proxied='https://corsproxy.io/?'+encodeURIComponent(url);
  else proxied='https://api.allorigins.win/raw?url='+encodeURIComponent(url);
  var img=new Image();
  img.crossOrigin='anonymous';
  img.onload=function(){
    try{
      var c=document.createElement('canvas');
      c.width=img.naturalWidth;c.height=img.naturalHeight;
      c.getContext('2d').drawImage(img,0,0);
      imgCache[url]=c.toDataURL('image/png');
      cb(true);
    }catch(e){cacheImg(url,pi+1,cb)}
  };
  img.onerror=function(){cacheImg(url,pi+1,cb)};
  img.src=proxied;
}

function startCaching(){
  collectUrls().forEach(function(url){cacheImg(url,0,function(){})});
}

function ensureAllCached(cb){
  var urls=collectUrls();
  var pending=urls.filter(function(u){return !imgCache[u]});
  if(pending.length===0) return cb();
  var done=false,left=pending.length;
  function finish(){if(done)return;done=true;cb()}
  pending.forEach(function(url){
    cacheImg(url,0,function(){left--;if(left<=0)finish()});
  });
  setTimeout(finish,10000);
}

function swapToCache(){
  var arr=[];
  tweetPage.querySelectorAll('img').forEach(function(img){
    var src=img.src;
    if(imgCache[src]){arr.push({el:img,orig:src});img.src=imgCache[src]}
  });
  return arr;
}
function swapBack(arr){arr.forEach(function(o){o.el.src=o.orig})}

/* ==================== 头像上传 ==================== */
function compressImage(file,maxSize,cb){
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var c=document.createElement('canvas');
      var w=img.width,h=img.height;
      if(w>maxSize||h>maxSize){
        if(w>h){h=Math.round(h*maxSize/w);w=maxSize}
        else{w=Math.round(w*maxSize/h);h=maxSize}
      }
      c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      cb(c.toDataURL('image/jpeg',0.85));
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function applyHighlight(color){
  var sel=window.getSelection();
  if(!sel.rangeCount||sel.isCollapsed){showToast('请先选中文字');return}
  var range=sel.getRangeAt(0);
  if(!richEditor.contains(range.commonAncestorContainer)){showToast('请在编辑框中选中文字');return}
  document.execCommand('hiliteColor',false,color);
}

function removeHighlight(){
  var sel=window.getSelection();if(!sel.rangeCount)return;
  if(!sel.isCollapsed){
    document.execCommand('hiliteColor',false,'transparent');cleanHighlightSpans();
  }else{
    var node=sel.anchorNode;
    while(node&&node!==richEditor){
      if(node.nodeType===1&&node.style&&node.style.backgroundColor&&
         node.style.backgroundColor!=='transparent'&&
         node.style.backgroundColor!=='rgba(0, 0, 0, 0)'){
        var p=node.parentNode;
        while(node.firstChild)p.insertBefore(node.firstChild,node);
        p.removeChild(node);richEditor.normalize();break;
      }
      node=node.parentNode;
    }
  }
}

function cleanHighlightSpans(){
  richEditor.querySelectorAll('span').forEach(function(s){
    var bg=s.style.backgroundColor;
    if(!bg||bg==='transparent'||bg==='rgba(0, 0, 0, 0)'){
      var hasOther=false;
      for(var i=0;i<s.style.length;i++){if(s.style[i]!=='background-color'){hasOther=true;break}}
      if(!hasOther){var p=s.parentNode;while(s.firstChild)p.insertBefore(s.firstChild,s);p.removeChild(s)}
      else{s.style.removeProperty('background-color')}
    }
  });
  richEditor.normalize();
}

/* ==================== 预览模式 ==================== */
var fadeTimer=null;
var BASE_WIDTH=430;

var editHeightMode = $('editHeightMode');
var pageHeightRow = $('pageHeightRow');

function syncHeightMode() {
  var automatic = editHeightMode.value === 'auto';

  document.body.classList.toggle('auto-tweet', automatic);
  pageHeightRow.hidden = automatic;
}

editHeightMode.addEventListener('change', syncHeightMode);

function getPageHeight() {
  if (editHeightMode.value !== 'auto') {
    return Math.max(
      300,
      Math.min(3000, Number(editPageHeight.value) || 932)
    );
  }

  var oldWidth = tweetPage.style.width;
  var oldHeight = tweetPage.style.height;

  tweetPage.style.width = BASE_WIDTH + 'px';
  tweetPage.style.height = 'auto';

  var height = Math.ceil(tweetPage.offsetHeight);

  tweetPage.style.width = oldWidth;
  tweetPage.style.height = oldHeight;

  return Math.max(1, height);
}

function applyScale() {
  syncHeightMode();

  var sw = window.innerWidth;
  var sh = window.innerHeight;
  var ph = getPageHeight();
  var automatic = editHeightMode.value === 'auto';

  var scale = automatic
    ? Math.min(sw / BASE_WIDTH, 1)
    : Math.min(sw / BASE_WIDTH, sh / ph, 1);

  var width = BASE_WIDTH * scale;
  var height = ph * scale;
  var left = Math.max(0, (sw - width) / 2);
  var top = automatic ? 0 : Math.max(0, (sh - height) / 2);

  Object.assign(tweetPage.style, {
    width: BASE_WIDTH + 'px',
    height: ph + 'px',
    position: automatic ? 'absolute' : 'fixed',
    top: top + 'px',
    left: left + 'px',
    transform: 'scale(' + scale + ')',
    transformOrigin: 'top left'
  });

  document.body.style.height = automatic
    ? Math.max(sh, Math.ceil(height)) + 'px'
    : '';
}

var layoutFrame = null;

function refreshPreviewLayout() {
  if (!document.body.classList.contains('preview-mode')) return;
  if (isSaving || layoutFrame !== null) return;

  layoutFrame = requestAnimationFrame(function() {
    layoutFrame = null;
    applyScale();
  });
}

tweetPage.querySelectorAll('img').forEach(function(img) {

if (document.fonts) {

/* ==================== 截图保存 ==================== */
var isSaving=false;

function waitForImage(img){
  return new Promise(function(resolve,reject){
    var timer=setTimeout(function(){
      finish(new Error('图片加载超时'));
    },15000);

    function finish(error){
      clearTimeout(timer);
      img.onload=null;
      img.onerror=null;
      if(error)reject(error);
      else resolve(img);
    }

    img.onload=function(){finish()};
    img.onerror=function(){
      finish(new Error('图片加载失败'));
    };

    if(img.complete){
      if(img.naturalWidth)finish();
      else finish(new Error('图片内容为空'));
    }
  });
}

function getCaptureSource(src){
  if(/^(data:|blob:)/.test(src)){
    return Promise.resolve(src);
  }
  if(imgCache[src]){
    return Promise.resolve(imgCache[src]);
  }

  return new Promise(function(resolve,reject){
    var timer=setTimeout(function(){
      reject(new Error('素材缓存超时'));
    },15000);

    cacheImg(src,0,function(ok){
      clearTimeout(timer);
      if(ok&&imgCache[src])resolve(imgCache[src]);
      else reject(new Error('无法缓存素材'));
    });
  });
}

function invertCaptureImage(img){
  var canvas=document.createElement('canvas');
  canvas.width=img.naturalWidth;
  canvas.height=img.naturalHeight;

  var ctx=canvas.getContext('2d');
  ctx.drawImage(img,0,0);

  var pixels=ctx.getImageData(
    0,0,canvas.width,canvas.height
  );
  var data=pixels.data;

  for(var i=0;i<data.length;i+=4){
    data[i]=255-data[i];
    data[i+1]=255-data[i+1];
    data[i+2]=255-data[i+2];
  }

  ctx.putImageData(pixels,0,0);
  return canvas.toDataURL('image/png');
}
async function waitForTweetFont(doc){
  var page=doc.getElementById('tweetPage');
  var walker=doc.createTreeWalker(page,4);
  var groups=new Map();
  var node;

  while((node=walker.nextNode())){
    var text=node.textContent;
    if(!text.trim())continue;

    var style=doc.defaultView.getComputedStyle(node.parentElement);
    var font=style.fontStyle+' '+style.fontWeight+' '+
      style.fontSize+' '+style.fontFamily;

    groups.set(font,(groups.get(font)||'')+text);
  }

  await Promise.all(
    Array.from(groups,function(entry){
      return doc.fonts.load(entry[0],entry[1]);
    })
  );

  await doc.fonts.ready;
}

btnSaveImg.addEventListener('click',async function(e){
  e.stopPropagation();
  if(isSaving)return;

  if(typeof html2canvas!=='function'){
    showToast('截图组件未加载，请刷新网页后重试');
    return;
  }

  isSaving=true;
  btnSaveImg.disabled=true;
  clearTimeout(fadeTimer);
  previewActions.style.display='none';

try{
    var scrollArea = tweetPage.querySelector('.scroll-content');
    var savedScrollTop = scrollArea.scrollTop;

    updatePreview();
    updateActionsImage();
    syncHeightMode();

    showToast('正在加载字体和截图素材…');
    await waitForTweetFont(document);

    await Promise.all(
      Array.from(tweetPage.querySelectorAll('img'))
        .filter(function(img) {
          var src = img.getAttribute('src');
          return src && src !== 'about:blank';
        })
        .map(waitForImage)
    );

    applyScale();

    scrollArea.scrollTop = editHeightMode.value === 'auto'
      ? 0
      : savedScrollTop;

    var ph = getPageHeight();
    var isDark=document.body.classList.contains('dark');

    var images=Array.from(
      tweetPage.querySelectorAll('img')
    );

    var sources=await Promise.all(
      images.map(function(img){
        var src=img.getAttribute('src');
        if(!src||src==='about:blank'){
          return Promise.resolve(null);
        }
        return getCaptureSource(img.src);
      })
    );

    showToast('正在生成截图…');

var captureScale = Math.min(
      2,
      Math.sqrt(12000000 / (BASE_WIDTH * ph)),
      16000 / ph
    );

    if (captureScale < 1) {
      throw new Error('内容过长，请减少正文后再保存');
    }

    var canvas=await html2canvas(tweetPage,{
      width:BASE_WIDTH,
      height:ph,
      scale:captureScale,
      useCORS:true,
      backgroundColor:null,
      scrollX:0,
      scrollY:0,

      onclone:async function(doc){
        var page=doc.getElementById('tweetPage');

        page.style.cssText=
          'width:'+BASE_WIDTH+'px;'+
          'height:'+ph+'px;'+
          'position:fixed;top:0;left:0;'+
          'transform:none;';

        var clonedImages=Array.from(
          page.querySelectorAll('img')
        );

        await Promise.all(
          clonedImages.map(async function(img,index){
            if(!sources[index])return;

            img.src=sources[index];
            await waitForImage(img);

            var needsInvert=isDark&&img.matches(
              '.top-nav-img,'+
              '.tweet-header-action-img,'+
              '.tweet-rate-icon'
            );

            if(needsInvert){
              img.src=invertCaptureImage(img);
              img.style.setProperty(
                'filter','none','important'
              );
              await waitForImage(img);
            }
          })
        );

await waitForTweetFont(doc);

var clonedScroll = page.querySelector('.scroll-content');
clonedScroll.scrollTop = editHeightMode.value === 'auto'
  ? 0
  : savedScrollTop;

var body=doc.getElementById('previewBody');
        var origin=body.getBoundingClientRect();
        var patches=[];
        var view=doc.defaultView;
        body.querySelectorAll('span, mark').forEach(function(el){
          var color=view.getComputedStyle(el).backgroundColor;
          if(color==='transparent'||color==='rgba(0, 0, 0, 0)')return;
          Array.from(el.getClientRects()).forEach(function(r){
            if(r.width&&r.height)patches.push({
              x:r.left-origin.left,y:r.top-origin.top,
              w:r.width,h:r.height,color:color
            });
          });
          el.style.setProperty('background-color','transparent','important');
        });
        var text=doc.createElement('span');
        text.style.cssText='position:relative;z-index:1;';
        while(body.firstChild)text.appendChild(body.firstChild);
        body.appendChild(text);
        patches.forEach(function(p){
          var bg=doc.createElement('span');
          bg.style.cssText='position:absolute;z-index:0;pointer-events:none;'+
            'left:'+p.x+'px;top:'+p.y+'px;width:'+p.w+'px;height:'+p.h+'px;'+
            'background-color:'+p.color+';border-radius:2px;';
          body.insertBefore(bg,text);
        });
      }
    });

    saveModalImg.src=canvas.toDataURL('image/png');
    saveModal.classList.add('show');
    showToast('图片已生成');
  }catch(error){
    console.error('截图失败：',error);
    showToast(error.message || '截图失败，请检查网络和素材链接后重试');
  }finally{
    isSaving=false;
    btnSaveImg.disabled=false;
    previewActions.style.display='';
    showPreviewBtns();
  }
});

fontFamily:editFontFamily.value,
bold:editBold.checked,
    reply:editReply.value,retweet:editRetweet.value,
    like:editLike.value,bookmark:editBookmark.value,
    timeSync:editTimeSync.checked,time:editTime.value,
    date:editDate.value,views:editViews.value,
pageHeight:editPageHeight.value,
heightMode:editHeightMode.value,
replyText:editReplyText.value
  };
  saveStore(d);
}

function loadDraft(){
  var d=loadStore();if(!d.draft)return false;
  var r=d.draft;

editHeightMode.value = r.heightMode === 'auto' ? 'auto' : 'fixed';
  syncHeightMode();
  if(r.charId&&r.charId!=='__new__')charSelect.value=r.charId;
  editAvatar.value=r.avatar||'';editName.value=r.name||'';
  editHandle.value=r.handle||'';editVerified.checked=!!r.verified;
  editShowTranslate.checked=!!r.showTranslate;editTransLang.value=r.transLang||'';
  editShowRate.checked=!!r.showRate;
  if(r.body&&r.body!=='<br>'&&r.body!=='<div><br></div>'){richEditor.innerHTML=r.body}
  else{richEditor.innerHTML=''}
  editIndent.checked=!!r.indent;
  editFontSize.value=r.fontSize||'16';editLineHeight.value=r.lineHeight||'1.55';
  editFontWeight.value=r.fontWeight||'580';
editFontFamily.value=r.fontFamily||'';
if(editFontFamily.selectedIndex<0)editFontFamily.value='';
editBold.checked=!!r.bold;
editReplyText.value=
  typeof r.replyText==='string'
    ? r.replyText
    : '发布你的回复';
  editReply.value=r.reply||'';editRetweet.value=r.retweet||'';
  editLike.value=r.like||'';editBookmark.value=r.bookmark||'';
  editViews.value=r.views||'';editPageHeight.value=r.pageHeight||'932';
  if(r.timeSync===false){
    editTimeSync.checked=false;editTime.value=r.time||'';editDate.value=r.date||'';
    editTime.readOnly=false;editDate.readOnly=false;
  }else{editTimeSync.checked=true}
  return true;
}

/* ==================== 初始化 ==================== */
function init(){
  var d=loadStore();
  if(d.darkMode)document.body.classList.add('dark');
  $('editDarkMode').checked=!!d.darkMode;
populateCharSelect();
populateFontSelect();
var hasDraft=loadDraft();
  if(editTimeSync.checked)startSync();
  checkEditorEmpty();
  updateAvatarThumb();
  updateActionsImage();
  updatePreview();
  setTimeout(startCaching,800);
  if(hasDraft)showToast('草稿已恢复 ✓');
}

init();

})();
</script>
</body>
</html>
